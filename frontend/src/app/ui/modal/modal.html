@if (isOpen) {
<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50" (click)="closeModal()">
    <div class="bg-neutral-900 rounded-lg shadow-xl w-full max-w-2xl mx-4" (click)="$event.stopPropagation()">
        <div class="flex justify-between rounded-t-lg p-6 bg-red-900 items-center mb-6">
            <h2 class="text-2xl font-bold text-white">
                @if (mode === 'add') {
                    Nova Tarefa
                } @else if (mode === 'edit') {
                    Editar Tarefa
                } @else {
                    Detalhes da Tarefa
                }
            </h2>
            <button (click)="closeModal()" class="text-gray-400 hover:text-white text-2xl font-bold hover:cursor-pointer">
                ×
            </button>
        </div>

        <div class="space-y-4 pl-6 pr-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Nome da Tarefa</label>
                <input 
                    type="text" 
                    [(ngModel)]="taskName"
                    [disabled]="mode === 'view'"
                    class="w-full px-4 py-2 text-white rounded border focus:border-cyan-500 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Status</label>
                    <select 
                        [(ngModel)]="taskStatus"
                        [disabled]="mode === 'view'"
                        class="w-full px-4 py-2 text-white rounded border focus:border-cyan-500 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <option value="PENDENTE">PENDENTE</option>
                        <option value="EM_ANDAMENTO">EM_ANDAMENTO</option>
                        <option value="CONCLUIDA">CONCLUIDA</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Prioridade</label>
                    <select 
                        [(ngModel)]="taskPriority"
                        [disabled]="mode === 'view'"
                        class="w-full px-4 py-2 text-white rounded border focus:border-cyan-500 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <option value="BAIXA">BAIXA</option>
                        <option value="MEDIA">MEDIA</option>
                        <option value="ALTA">ALTA</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Descrição</label>
                <textarea 
                    [(ngModel)]="taskDescription"
                    [disabled]="mode === 'view'"
                    rows="4"
                    class="w-full px-4 py-2 text-white rounded border focus:border-cyan-500 focus:outline-none resize-none disabled:opacity-50 disabled:cursor-not-allowed"
                ></textarea>
            </div>
            
            <div class="flex justify-end gap-3 mb-5">
                @if (mode === 'view') {
                    <app-button 
                        content="Editar" 
                        (onClick)="changeMode('edit')"
                        severity="info"
                    ></app-button>
                    <app-button 
                        content="Excluir" 
                        severity="danger" 
                        (onClick)="deleteTask()"
                    ></app-button>
                } @else {
                    <app-button 
                        content="Cancelar" 
                        severity="secondary"
                        (onClick)="mode === 'add' ? closeModal() : changeMode('view')"
                    ></app-button>
                    <app-button 
                        content="Salvar" 
                        severity="success"
                        (onClick)="saveChanges()"
                    ></app-button>
                }
            </div>
        </div>

    </div>
</div>

<app-confirm-modal 
    [isOpen]="isConfirmDeleteOpen"
    (confirm)="confirmDelete()"
    (cancel)="cancelDelete()"
></app-confirm-modal>
}
