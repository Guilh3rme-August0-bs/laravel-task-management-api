@if (isOpen) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-zinc-800 border border-stone-700 rounded-lg shadow-xl mx-4 gap-3 flex flex-col p-6">
        <h3 class="text-xl font-semibold text-white mb-3">Insira o novo nome</h3>
        <div class="flex gap-3 justify-end">
            <div class="flex flex-col gap-2 w-full">
                <label for="newUsername" class="text-white text-md">New Username</label>
                <input [(ngModel)]="newUsername" class="bg-zinc-950 w-57 border border-neutral-700 text-md p-2 rounded-md" type="text"/>
                <label for="password" class="text-white text-md">Password</label>
                <p-password [(ngModel)]="password" [toggleMask]="true" class="w-57"/>
            </div>
        </div>
        <div class="flex gap-3 justify-end">
            <div class="flex gap-3 justify-end w-full">
                <app-button
                  content="Cancelar"
                  severity="secondary"
                  (onClick)="onCancel()"
                ></app-button>
                <app-button
                  content="Confirmar"
                  severity="danger"
                  (onClick)="changeUsername()"
                ></app-button>
            </div>
          </div>
    </div>
</div>
}
