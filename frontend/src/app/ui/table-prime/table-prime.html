
<p-table 
    [value]="data" 
    selectionMode="single" 
    dataKey="id" 
    [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Tarefa</th>
                <th>Status</th>
                <th>Prioridade</th>
                <th>Usuário</th>
                <th>Criado em</th>
                <th>Atualizado em</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-task>
            <tr [pSelectableRow]="task"  (click)="onRowClick(task)">
            <td>{{task.id}}</td>
            <td>{{task.tarefa}}</td>
            <td>{{task.status}}</td>
            <td [class]="colorPriority(task.prioridade)">{{task.prioridade}}</td>
            <td>{{task.user.name}}</td>
            <td>{{task.created_at | date:'dd/MM/yyyy HH:mm'}}</td>
            <td>{{task.updated_at | date:'dd/MM/yyyy HH:mm'}}</td>
        </tr>
    </ng-template>
</p-table>
