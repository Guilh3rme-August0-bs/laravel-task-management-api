  <div class="flex mt-10 items-center justify-end gap-2">
    <span class="text-white">Itens por página: </span>
    <p-select [options]="options" optionLabel="label" optionValue="value" [(ngModel)]="rows2"
      (ngModelChange)="first2 = 0" />
    <p-paginator [first]="first2" [rows]="rows2" [totalRecords]="totalRecords()" (onPageChange)="onPageChange2($event)"
      [showCurrentPageReport]="true" currentPageReportTemplate="{first} - {last} de {totalRecords}"
      [showPageLinks]="false" [showFirstLastIcon]="false"></p-paginator>
  </div>

</div>

<app-modal [isOpen]="isModalOpen()" [task]="selectedTask()" [mode]="mode()" (close)="closeModal()"
  (save)="saveTask($event)" (add)="addTask($event)" (delete)="deleteTask($event)"></app-modal>
