<header class="bg-linear-to-r from-red-900 to-orange-600 p-4 text-white text-2xl font-bold">Task Management CRUD</header>
<div class="flex flex-col gap-8 h-[90vh] bg-linear-to-br from-black to-red-950 items-center justify-center">
  <div class="flex justify-center items-center gap-2 h-100 w-full px-4">
    <app-table-prime (rowClick)="openModal($event, 'view')">
      <app-button caption-left content="Nova tarefa" title="Adicionar nova tarefa" severity="contrast"
        (onClick)="openModal(null, 'add')"></app-button>
    </app-table-prime>
  </div>
</div>

<app-modal [isOpen]="isModalOpen()" [task]="selectedTask()" [mode]="mode()" (close)="closeModal()"
  (save)="saveTask($event)" (add)="addTask($event)" (delete)="deleteTask($event)"></app-modal>
