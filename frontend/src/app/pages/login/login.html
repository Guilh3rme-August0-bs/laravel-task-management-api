<div class="flex flex-col gap-5 items-center justify-center">
  <h1 class="text-4xl font-bold text-white">Login</h1>
  <form
    class="flex flex-col bg-blue-950 p-4 gap-5 rounded-md items-center justify-center"
    [formGroup]="form"
  >
    <input
      class="w-full bg-blue-200 p-2 rounded-sm"
      type="text"
      placeholder="Email"
      formControlName="email"
      
    />
    <input
      class="w-full bg-blue-200 p-2 rounded-sm"
      type="password"
      placeholder="Password"
      formControlName="password"
    />
    <app-button content="Login" (onClick)="login()" [disabled]="form.invalid"></app-button>
  </form>
</div>
