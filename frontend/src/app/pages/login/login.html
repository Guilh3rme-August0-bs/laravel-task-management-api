<div class="flex flex-col gap-9 h-[90vh] items-center justify-center">
  <h1 class="text-6xl font-bold text-white">Login</h1>
  <form class="flex flex-col bg-black p-6 border gap-8 rounded-md items-center justify-center" [formGroup]="form">
    <div class="flex flex-col gap-2">
      <label for="email" class="text-white text-md">Email</label>
      <input class="w-57 border border-neutral-700 text-md p-2 rounded-md" type="text" placeholder="Email" formControlName="email" />
    </div>
    <!--    <div class="flex flex-col gap-2">
      <label for="password" class="text-white text-md">Password</label>
      <input
        class="w-90 bg-blue-200 text-md p-2 rounded-sm"
        type="password"
        placeholder="Password"
        formControlName="password"
      />
    </div>-->
    <div class="card flex justify-content-center w-full">
      <p-password formControlName="password" [toggleMask]="true" [feedback]="false" class="w-full" />
    </div>
    <app-button content="Login" (onClick)="login()" [disabled]="form.invalid" severity="contrast"></app-button>
  </form>
  @if (loading()) {
  <app-loading></app-loading>
  }
</div>
