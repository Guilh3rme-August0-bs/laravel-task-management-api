services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/database/database.sqlite:/app/database/database.sqlite #utilizar arquivos do banco na máquina local
      - ./backend/storage/oauth-private.key:/app/storage/oauth-private.key:ro
      - ./backend/storage/oauth-public.key:/app/storage/oauth-public.key:ro
      
  frontend:
      build: ./frontend
      ports:
        - "4200:4200"
      depends_on:
        - backend
